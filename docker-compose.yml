name: ar-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  s4-ar-mock:
    build: ./s4-ar-mock
    restart: unless-stopped
    environment:
      EXECUTOR_KEY: ${EXECUTOR_KEY}
      DB_PATH: /data/mock.db
      TZ: Europe/Berlin
    volumes:
      - mock_data:/data
      - ./s4-ar-mock/snapshot:/app/snapshot:ro
      - ./s4-ar-mock/seed:/app/seed:ro
    ports:
      - "127.0.0.1:8001:8000"

  s4-ar-mcp:
    build: ./s4-ar-mcp
    restart: unless-stopped
    depends_on:
      - s4-ar-mock
    environment:
      S4_MODE: ${S4_MODE}
      MOCK_URL: http://s4-ar-mock:8000
      SAP_SANDBOX_BASE: ${SAP_SANDBOX_BASE}
      SAP_SANDBOX_APIKEY: ${SAP_SANDBOX_APIKEY}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  pgdata:
  n8n_data:
  mock_data:
